name: CI & Release (macOS Notarized DMG + Android Unsigned & Debug APKs)

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_notarization:
        description: "Fail the build if Apple Developer ID / notarization secrets are missing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-browser-dmg:
    name: Build, Sign & Notarize macOS Browser DMG (arm64)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notarization_status: ${{ steps.dmg.outputs.notarization_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version & tag
        id: meta
        run: |
          BASE_VERSION="0.1.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            APP_VERSION="${TAG_NAME#v}"
            PRERELEASE="false"
          else
            TAG_NAME="v${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
            APP_VERSION="${BASE_VERSION}"
            PRERELEASE="true"
          fi
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Install Ninja & CMake for Static Hermes
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Cache Static Hermes toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/hermes-static_h
          key: static-hermes-macos-arm64-${{ hashFiles('apps/hermes-browser/scripts/build-hermes.sh') }}

      - name: Cache Rust Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/hermes-browser/target
          key: cargo-hermes-browser-macos-arm64-${{ hashFiles('apps/hermes-browser/Cargo.lock', 'apps/hermes-browser/build.rs') }}
          restore-keys: |
            cargo-hermes-browser-macos-arm64-

      - name: Import Apple Developer ID certificate (if configured)
        id: signing_cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE || secrets.APPLE_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::MACOS_CERTIFICATE secret is not configured; falling back to ad-hoc Hardened Runtime signing."
            exit 0
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/walkaway-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"

          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          rm -f "${CERT_PATH}"
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build, Sign, Notarize & Verify Walkaway Browser DMG
        id: dmg
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          REQUIRE_NOTARIZATION: ${{ inputs.require_notarization }}
        run: |
          chmod +x scripts/build-macos-dmg.sh scripts/check-notarization.sh scripts/prepare-apple-secrets.sh
          if [[ "${REQUIRE_NOTARIZATION}" == "true" && "${{ steps.signing_cert.outputs.signed }}" != "true" ]]; then
            echo "ERROR: require_notarization=true, but MACOS_CERTIFICATE secret is not configured." >&2
            exit 1
          fi

          ./scripts/build-macos-dmg.sh --release

          STATUS="$(cat build/notarization.status)"
          echo "notarization_status=${STATUS}" >> "${GITHUB_OUTPUT}"
          if [[ "${STATUS}" == "notarized" ]]; then
            ./scripts/check-notarization.sh build/Walkaway.dmg
          elif [[ "${REQUIRE_NOTARIZATION}" == "true" ]]; then
            echo "ERROR: require_notarization=true, but build/notarization.status=${STATUS}" >&2
            exit 1
          else
            ./scripts/check-notarization.sh build/Walkaway.dmg --allow-adhoc
          fi

          DMG_PATH="$(ls build/walkaway-macos-*-release.dmg | head -n 1)"
          shasum -a 256 "${DMG_PATH}" build/Walkaway.dmg build/Walkaway.zip > build/SHA256SUMS-macos.txt
          cat build/SHA256SUMS-macos.txt

      - name: Upload macOS DMG & Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkaway-macos-dmg
          path: |
            build/walkaway-macos-*-release.dmg
            build/Walkaway.dmg
            build/Walkaway.zip
            build/SHA256SUMS-macos.txt
            build/notarization.status
          if-no-files-found: error
          retention-days: 90

  android-apk:
    name: Build Android Unsigned & Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-notification-bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -n 1)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MWDAT_GITHUB_TOKEN: ${{ secrets.MWDAT_GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mwdat_application_id: ${{ secrets.MWDAT_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_mwdat_client_token: ${{ secrets.MWDAT_CLIENT_TOKEN }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Unsigned Release APK and Debug APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MWDAT_GITHUB_TOKEN: ${{ secrets.MWDAT_GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mwdat_application_id: ${{ secrets.MWDAT_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_mwdat_client_token: ${{ secrets.MWDAT_CLIENT_TOKEN }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Stage Unsigned and Debug APKs
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist/android
          cp apps/android-notification-bridge/app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/android/walkaway-bridge-unsigned.apk
          cp apps/android-notification-bridge/app/build/outputs/apk/debug/app-debug.apk \
            dist/android/walkaway-bridge-debug.apk
          shasum -a 256 \
            dist/android/walkaway-bridge-unsigned.apk \
            dist/android/walkaway-bridge-debug.apk > dist/android/SHA256SUMS-android.txt
          cat dist/android/SHA256SUMS-android.txt

      - name: Upload Android Unsigned & Debug APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: walkaway-android-apks
          path: |
            dist/android/walkaway-bridge-unsigned.apk
            dist/android/walkaway-bridge-debug.apk
            dist/android/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release (macOS DMG + Android APKs)
    needs: [macos-browser-dmg, android-apk]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: walkaway-macos-dmg
          path: release-assets/macos

      - name: Download Android APKs Artifact
        uses: actions/download-artifact@v4
        with:
          name: walkaway-android-apks
          path: release-assets/android

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.macos-browser-dmg.outputs.tag_name }}
          APP_VERSION: ${{ needs.macos-browser-dmg.outputs.app_version }}
          PRERELEASE: ${{ needs.macos-browser-dmg.outputs.prerelease }}
          NOTARY_STATUS: ${{ needs.macos-browser-dmg.outputs.notarization_status }}
        run: |
          cat release-assets/macos/SHA256SUMS-macos.txt release-assets/android/SHA256SUMS-android.txt > release-assets/SHA256SUMS.txt
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "${NOTES_FILE}" <<EOF
          ## Walkaway ${TAG_NAME}

          - **Commit**: \`${GITHUB_SHA}\`
          - **macOS Browser Disk Image**: \`Walkaway.dmg\` (\`notarization_status=${NOTARY_STATUS}\`)
          - **Android Unsigned APK**: \`walkaway-bridge-unsigned.apk\`
          - **Android Debug APK**: \`walkaway-bridge-debug.apk\`

          ### SHA-256 Checksums
          \`\`\`
          $(cat release-assets/SHA256SUMS.txt)
          \`\`\`
          EOF

          PRE_FLAG=""
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRE_FLAG="--prerelease"
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" \
              release-assets/macos/Walkaway.dmg \
              release-assets/macos/walkaway-macos-*-release.dmg \
              release-assets/macos/Walkaway.zip \
              release-assets/android/walkaway-bridge-unsigned.apk \
              release-assets/android/walkaway-bridge-debug.apk \
              release-assets/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${TAG_NAME}" \
              release-assets/macos/Walkaway.dmg \
              release-assets/macos/walkaway-macos-*-release.dmg \
              release-assets/macos/Walkaway.zip \
              release-assets/android/walkaway-bridge-unsigned.apk \
              release-assets/android/walkaway-bridge-debug.apk \
              release-assets/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "Walkaway ${TAG_NAME}" \
              --notes-file "${NOTES_FILE}" \
              ${PRE_FLAG}
          fi
